# Compose de production, utilisé par Coolify.
# Coolify lance `docker compose -f docker-compose.prod.yml`, donc ce fichier
# doit être autonome : aucun merge avec docker-compose.yml n'a lieu.
#
# Différences avec le compose de dev :
#   - pas de bind mount `.:/app` : le code servi est celui buildé dans l'image
#   - le port Postgres n'est pas publié sur l'hôte, la base reste sur le réseau interne
services:
  app:
    build: .
    ports:
      - "8501:8501"
    depends_on:
      - db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit être défini}
      POSTGRES_DB: ${POSTGRES_DB:-ragproject}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
